<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата не выполнена — SpeedCam Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #0a0e17;
            color: #f8fafc;
        }
        .card {
            max-width: 460px;
            margin: 0 auto;
            background: #131b2e;
            padding: 40px 32px;
            border-radius: 24px;
            border: 1px solid #1e293b;
            box-shadow: 0 12px 36px rgba(0,0,0,0.4);
        }
        .icon {
            font-size: 64px;
            color: #ef4444;
            margin-bottom: 20px;
            display: inline-block;
        }
        h2 {
            font-size: 26px;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #334155;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #475569;
        }
    </style>
    <script>
        window.onload = function() {
            const appUrl = "speedcam://payment/return?gateway=selfemployed_rf&status=fail";
            setTimeout(function() {
                window.location.href = appUrl;
            }, 1000);
        };
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">✕</div>
        <h2>Оплата не завершена</h2>
        <p>Операция была отменена или отклонена банком. Средства не списаны. Вы можете повторить попытку в приложении.</p>
        <a class="btn" href="speedcam://payment/return?gateway=selfemployed_rf&status=fail">Вернуться в SpeedCam</a>
    </div>
</body>
</html>
