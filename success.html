<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оплата успешна — SpeedCam Pro</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background: #0a0e17;
            color: #f8fafc;
        }
        .card {
            max-width: 460px;
            margin: 0 auto;
            background: #131b2e;
            padding: 40px 32px;
            border-radius: 24px;
            border: 1px solid #1e293b;
            box-shadow: 0 12px 36px rgba(0,0,0,0.4);
        }
        .icon {
            font-size: 64px;
            color: #10b981;
            margin-bottom: 20px;
            display: inline-block;
        }
        h2 {
            font-size: 26px;
            margin-bottom: 12px;
        }
        p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .small-note {
            font-size: 12px;
            color: #64748b;
            margin-top: 20px;
        }
    </style>
    <script>
        window.onload = function() {
            // Мгновенный возврат в мобильное приложение SpeedCam по deep link
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('id') || urlParams.get('order_id') || '';
            const appUrl = "speedcam://payment/return?gateway=selfemployed_rf&status=success&orderId=" + encodeURIComponent(orderId);
            
            // Пытаемся автоматически открыть приложение
            setTimeout(function() {
                window.location.href = appUrl;
            }, 500);
        };
    </script>
</head>
<body>
    <div class="card">
        <div class="icon">✓</div>
        <h2>Оплата успешно завершена!</h2>
        <p>Благодарим за покупку! Лицензия SpeedCam Pro активирована. Происходит автоматический возврат в приложение...</p>
        <a class="btn" id="returnBtn" href="speedcam://payment/return?gateway=selfemployed_rf&status=success">Вернуться в SpeedCam</a>
        <div class="small-note">Если приложение не открылось автоматически, нажмите кнопку выше.</div>
    </div>
</body>
</html>
